services:
  - type: web
    name: math-logic-test
    runtime: node
    # Нәтижелер файлда сақталады, сондықтан тұрақты диск қажет (тегін жоспарда диск жоқ).
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/questions
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_FILE
        value: /var/data/results.json
    disk:
      name: results
      mountPath: /var/data
      sizeGB: 1
